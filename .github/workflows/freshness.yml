name: Freshness check

# Monthly: are the catalogue's model years, the tax year and the exchange rates still current?
# A failed run emails the repo owner. See web/src/lib/freshness.test.ts for what each check means.
on:
  schedule:
    - cron: "0 3 2 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx vitest run src/lib/freshness.test.ts
        working-directory: web
        env:
          FRESHNESS: "1"
