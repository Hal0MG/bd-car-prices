name: ML tests and image

on:
  push:
    paths: ["ml/**", ".github/workflows/ml.yml"]
  pull_request:
    paths: ["ml/**", ".github/workflows/ml.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ml-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ml

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ml/pyproject.toml
      - run: pip install -e ".[dev,api,mlops]"
      # The tests train on made-up listings (shotti_ml.synthetic); CI never sees data/raw.
      # Bikroy PDF print times are local wall-clock times, read in the zone the PDFs were saved in.
      - run: python -m pytest -q
        env:
          TZ: America/Chicago

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ml/pyproject.toml
      - run: pip install -e .
      - name: Train a small model on made-up listings
        run: |
          python -I -m shotti_ml.synthetic "$RUNNER_TEMP/synthetic"
          python -I -m shotti_ml.train --data-dir "$RUNNER_TEMP/synthetic" --out-dir artifacts --version ci --cv-repeats 0 --no-mlflow
      - name: Build the image (not pushed anywhere)
        run: docker build --build-arg ARTIFACT=artifacts/ci -t shotti-price:ci .
      - name: Smoke-test the container
        run: |
          docker run -d --name price -p 8000:8000 shotti-price:ci
          for i in $(seq 1 30); do curl -fs localhost:8000/health && break; sleep 1; done
          curl -fs localhost:8000/health
          curl -fs -X POST localhost:8000/predict -H 'content-type: application/json' \
            -d '{"brand": "Toyota", "model": "Axio", "build_year": 2018, "mileage_km": 60000, "engine_cc": 1500, "fuel": "petrol"}'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8000/predict -H 'content-type: application/json' -d '{"brand": "Toyota"}')" = 422
      - if: always()
        run: docker logs price || true
