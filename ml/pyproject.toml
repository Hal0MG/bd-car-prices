[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shotti-ml"
version = "0.1.0"
description = "Used-car price modelling for the Shotti Dam site"
requires-python = ">=3.11"
dependencies = [
  "pandas",
  "numpy",
  "scikit-learn",
  "lightgbm",
  "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest", "httpx>=0.27"]
# Serving: python -m uvicorn shotti_ml.api:app
api = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.6"]
# Experiment tracking for python -m shotti_ml.train (local SQLite store in mlruns/)
mlops = ["mlflow>=3.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
